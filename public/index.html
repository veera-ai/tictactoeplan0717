<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Tic-Tac-Toe</title>
    <meta name="theme-color" content="#0b1220" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <div class="bg">
      <div class="shell">
        <header class="topbar" aria-label="Header">
          <div class="brand">
            <div class="brand__mark" aria-hidden="true">
              <span class="mark-x">X</span><span class="mark-o">O</span>
            </div>
            <div class="brand__text">
              <h1 class="brand__title">Tic‑Tac‑Toe</h1>
              <p class="brand__subtitle">Clean UI backed by the existing Express API.</p>
            </div>
          </div>

          <div class="meta-card" aria-label="Game metadata">
            <div class="meta-card__label">Game ID</div>
            <code id="gameId" class="meta-card__value">—</code>
          </div>
        </header>

        <main class="card" aria-label="Game panel">
          <div class="controls" aria-label="Controls">
            <div class="controls__left">
              <button id="newGameBtn" type="button" class="btn btn--primary">
                <span class="btn__icon" aria-hidden="true">＋</span>
                New game
              </button>

              <button id="restartBtn" type="button" class="btn btn--secondary">
                <span class="btn__icon" aria-hidden="true">↻</span>
                Restart
              </button>
            </div>

            <div class="controls__right">
              <div id="status" class="status" role="status" aria-live="polite">Loading…</div>
            </div>
          </div>

          <section class="board-section" aria-label="Board section">
            <div class="board-wrap">
              <div id="board" class="board" role="grid" aria-label="Tic-Tac-Toe board"></div>
            </div>

            <p class="hint">
              Tip: You can press <kbd>N</kbd> for a new game or <kbd>R</kbd> to restart.
            </p>
          </section>
        </main>

        <footer class="footer" aria-label="Footer">
          <div class="footer__left">
            <span class="footer__label">API</span>
            <code>POST /api/games</code>
            <code>GET /api/games/:id</code>
            <code>POST /api/games/:id/moves</code>
          </div>
          <div class="footer__right">
            <a class="footer__link" href="/health">/health</a>
            <span class="footer__dot" aria-hidden="true">•</span>
            <a class="footer__link" href="/openapi.json">openapi.json</a>
          </div>
        </footer>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
